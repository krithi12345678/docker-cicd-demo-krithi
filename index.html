<!DOCTYPE html>
<html>
<head>
    <title>My First Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            text-align: center;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            padding: 25px;
        }

        section {
            background-color: white;
            margin: 20px;
            padding: 25px;
            border-radius: 10px;
        }

        button {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #555;
        }

        footer {
            background-color: #333;
            color: white;
            padding: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>My First HTML Project 🚀</p>
    </header>

    <section>
        <h2>About Me</h2>
        <p>Hello! I am learning HTML and building my first website.</p>
    </section>

    <section>
        <h2>My Skills</h2>
        <p>HTML | CSS | Git | AWS | DevOps</p>
    </section>

    <section>
        <h2>My Project</h2>
        <p>This website is my simple HTML project.</p>

        <button onclick="showMessage()">Click Me</button>
    </section>

    <section>
        <h2>Contact Me</h2>
        <p>Email: example@gmail.com</p>
    </section>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

    <script>
        function showMessage() {
            alert("Hello! Welcome to my website 😊");
        }
    </script>

</body>
</html>
